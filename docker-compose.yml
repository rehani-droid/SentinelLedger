services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelledger
      POSTGRES_USER: sentinelledger
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://sentinelledger:change-me@postgres:5432/sentinelledger
    ports: ["8000:8000"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { postgres_data: {} }
