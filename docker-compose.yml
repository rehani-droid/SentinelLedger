services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelledger}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelledger}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sentinelledger}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RUN_DB_INIT: ${RUN_DB_INIT:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_CISO_PASSWORD: ${DEMO_CISO_PASSWORD:-CisoDemo!2026}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-AnalystDemo!2026}
      DEMO_AUDITOR_PASSWORD: ${DEMO_AUDITOR_PASSWORD:-AuditorDemo!2026}
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["5173:5173"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: {}
